# @xingruochun/dsh-rea  REA (Reverse Engineer Anything) inside DSH.
#
# This patch inserts ONE row: this package itself. It deliberately does not
# name the official MCP client component, because a patch that instantiates a
# component in the protected namespace is hard-blocked by plugin-store
# prechecks (they scan this whole file, comments included) and rated
# `route: blocked`. Instead `index.js` mounts the official client at runtime,
# peer-resolved, degrading quietly when it is absent.
#
# The row's `config` below is what `index.js` reads. Everything machine-specific
# (the interpreter, REA's entry point, Ghidra/JDK paths) is computed at runtime,
# so the same package works on any machine  nothing here is a local path.
- insert:
    - id: dsh-rea
      name: '@xingruochun/dsh-rea'
      config:
        serverName: rea
        toolCallTimeoutMs: 300000
        # Keep false: an unreachable REA degrades to a missing tool set instead
        # of failing profile startup.
        failOnStartupError: false