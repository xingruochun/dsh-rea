# dsh-rea bundle patch — inserts this bundle's own Host half (index.js) into the
# profile composition. index.js mounts DSH's official MCP client at runtime and
# points it at the REA server, so no @deepseek-ai component is named here (DSH
# STORE blocks patches whose insert rows declare the protected namespace).
#
# `config` is the machine-specific half. Everything portable — the node
# executable and the path of the REA entry script — is derived in index.js, so
# this file never carries an absolute path from the machine it was written on.
- insert:
    - id: dsh-rea
      name: '@xingruochun/dsh-rea'
      config:
        serverName: rea
        toolCallTimeoutMs: 300000
        # Optional — point REA at the reverse-engineering engines on your machine
        # so its Ghidra / Android tools become available. Uncomment and edit:
        # env:
        #   GHIDRA_INSTALL_DIR: 'C:\ghidra\ghidra_12.1.4_PUBLIC'
        #   JAVA_HOME: 'C:\Program Files\Java\jdk-21'
        #   REA_JADX_MCP_JAR: 'C:\tools\jadx-headless-mcp-all.jar'
        #   REA_APKTOOL_COMMAND: 'C:\tools\apktool.exe'